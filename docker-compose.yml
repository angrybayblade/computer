name: me

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-me}
      POSTGRES_USER: ${POSTGRES_USER:-me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://viraj.computer}
    image: me-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:10010:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - EDIT_SESSION_SECRET
      - DATABASE_URL=${DATABASE_URL:-postgresql://me:me@db:5432/me}
      - SITE_URL=${SITE_URL:-https://viraj.computer}

volumes:
  postgres-data:
