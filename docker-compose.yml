name: me

services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:3ec6803
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SQLD_NODE=primary
    volumes:
      - libsql-data:/var/lib/sqld

  web:
    build: .
    image: me-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:10010:3000"
    depends_on:
      - db
    environment:
      - EDIT_SESSION_SECRET
      - DATABASE_URL=${DATABASE_URL:-http://db:8080}
      - DATABASE_AUTH_TOKEN

volumes:
  libsql-data:
